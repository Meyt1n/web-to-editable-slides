name: Validate skill and offline helpers
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/template_pack.py prepare examples/template-extraction/observations.json --source-dir . --output-dir output/template
      - run: python scripts/template_pack.py check output/template/template.json
      - run: python scripts/build_demo.py --output-dir output/demo
      - run: python scripts/review_design_plan.py output/demo/design-plan.json --require-template
      - run: python scripts/check_pptx.py output/demo/green-sprout.pptx --require-fade
      - run: python scripts/build_gallery.py --output-dir output/gallery
      - run: python scripts/review_design_plan.py output/gallery/design-plan.json
      - run: python scripts/check_pptx.py output/gallery/design-gallery.pptx --require-fade
